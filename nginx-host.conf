# Nginx Reverse Proxy Configuration for GCP Compute Engine
# This file should be copied to /etc/nginx/sites-available/rescam on your VM
#
# Installation steps (on VM):
# 1. sudo cp nginx-host.conf /etc/nginx/sites-available/rescam
# 2. sudo ln -s /etc/nginx/sites-available/rescam /etc/nginx/sites-enabled/
# 3. sudo rm /etc/nginx/sites-enabled/default
# 4. sudo nginx -t
# 5. sudo systemctl restart nginx

# HTTP server - redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name 35-224-238-97.nip.io;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 35-224-238-97.nip.io;

    # SSL Certificate Configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/35-224-238-97.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/35-224-238-97.nip.io/privkey.pem;

    # SSL Security Settings (Mozilla Intermediate Configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/rescam-access.log;
    error_log /var/log/nginx/rescam-error.log;

    # Special handling for Server-Sent Events (SSE) stream endpoint
    # This endpoint streams real-time email updates to the frontend
    location ~ /api/emails/stream {
        proxy_pass http://localhost:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        # Critical SSE settings - disable buffering and caching
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;  # 24 hours for long-lived connections
        chunked_transfer_encoding on;
    }

    # API proxy (backend Node/FastAPI service)
    location /api {
        proxy_pass http://localhost:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Standard timeouts for API requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Frontend (React SPA served by Nginx in Docker container)
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # SPA fallback routing is handled by the frontend container's Nginx
        proxy_redirect off;
    }
}
