services:
  frontend:
    build:
      context: ./src/app
      dockerfile: Dockerfile
      # Build-time arguments for Vite (must be set at build time)
      args:
        - VITE_API_URL=${VITE_API_URL:-https://35-224-238-97.nip.io/api}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-1097076476714-9iaegt01febhsqh14niv8m2sjl8q07n7.apps.googleusercontent.com}
    image: rescam-frontend
    container_name: rescam-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped
    # Use .env.production for production deployment
    env_file:
      - .env.production

  api:
    build:
      context: ./src/api
      dockerfile: Dockerfile
    image: rescam-api
    container_name: rescam-api
    ports:
      - "5050:5050"
    volumes:
      - ./secrets:/home/app/.config/gcloud:ro
      - ./src/models:/app/models:ro
    restart: unless-stopped
    # Use .env.production for production deployment
    # For local development, create a .env file or use defaults
    env_file:
      - .env.production
    environment:
      # These override env_file values if needed
      - GOOGLE_APPLICATION_CREDENTIALS=/home/app/.config/gcloud/application_default_credentials.json

